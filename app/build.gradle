plugins {
    id 'com.android.application'
}

// Release-signing credentials live in the gitignored root local.properties:
//   eo1.signing.store.file=/path/to/eo1-release.keystore
//   eo1.signing.store.password=...
//   eo1.signing.key.alias=EO1
//   eo1.signing.key.password=...
// Without the keystore the release build is unsigned.
def signingProps = new java.util.Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.aphex3k.eo1'
    compileSdk 34

    defaultConfig {
        applicationId "com.aphex3k.eo1"
        minSdk 19
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk 19
        // maxSdk 19 applies to release only (see src/release/AndroidManifest.xml) so
        // debug APKs can install on the Apple Silicon API 21 fallback AVD.
        // -PVERSION_CODE (publish-update.sh) wins, then the legacy BUILD_NUMBER, then 1.
        if (project.hasProperty('VERSION_CODE')) {
            versionCode = Integer.parseInt(project.VERSION_CODE.toString())
        }
        else if (project.hasProperty('BUILD_NUMBER')) {
            versionCode = Integer.parseInt(project.BUILD_NUMBER.toString())
        }
        else {
            versionCode = 1
        }
        versionName project.hasProperty('VERSION_NAME') ? project.VERSION_NAME.toString() : "2.0.0"
        multiDexEnabled true
        // Prefer Amlogic TsPlayer when libTsPlayer-jni loads; MediaPlayer remains fallback.
        buildConfigField "boolean", "USE_TSPLAYER", "true"
    }
    signingConfigs {
        release {
            if (signingProps.getProperty('eo1.signing.store.file')) {
                storeFile file(signingProps.getProperty('eo1.signing.store.file'))
                storePassword signingProps.getProperty('eo1.signing.store.password')
                keyAlias signingProps.getProperty('eo1.signing.key.alias', 'EO1')
                keyPassword signingProps.getProperty('eo1.signing.key.password')
            }
        }
    }
    def useReleaseSigningForDebug = project.hasProperty('USE_RELEASE_SIGNING_FOR_DEBUG') && project.USE_RELEASE_SIGNING_FOR_DEBUG.toBoolean()
buildTypes {
        release {
            // Unsigned release when no signing props are configured (publish-update.sh refuses to build anyway).
            if (signingProps.getProperty('eo1.signing.store.file')) {
                signingConfig signingConfigs.release
            }
            ndk {
                abiFilters 'armeabi-v7a'
            }
            // see: https://developer.android.com/build/shrink-code
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type. Make sure to use a build
            // variant with `isDebuggable=false`.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            debuggable = false
        }
        debug {
            // armeabi-v7a = EO hardware (TsPlayer .so); arm64-v8a = Apple Silicon API 21
            // fallback AVD (MediaPlayer only — no TsPlayer .so for that ABI).
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            if (useReleaseSigningForDebug && signingProps.getProperty('eo1.signing.store.file')) {
                signingConfig signingConfigs.release
                // When using release signing for debug build, make it non-debuggable for security
                debuggable = false
                // Override BuildConfig.DEBUG to false to disable debug-only code paths
                buildConfigField "boolean", "DEBUG", "false"
                // Disable test coverage instrumentation for non-debuggable builds
                enableUnitTestCoverage false
                enableAndroidTestCoverage false
            } else {
                // Default debug build behavior
                enableUnitTestCoverage true
                enableAndroidTestCoverage true
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

}

dependencies {

    // https://developer.android.com/build/multidex#groovy
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1' // Last version to support minSDK 19
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0' // Last version to support minSDK 19
    implementation 'androidx.navigation:navigation-fragment:2.7.7' // Last version to support minSDK 19
    implementation 'androidx.navigation:navigation-ui:2.7.7' // Last version to support minSDK 19
    implementation 'com.squareup.retrofit2:retrofit:2.6.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // OkHttp 3.x transitively pulls okio 1.15.0 (CVE-2023-3635); 1.17.6 is the last 1.x
    // release and is API-compatible with both okhttp 3.x and this app's direct okio usage.
    implementation 'com.squareup.okio:okio:1.17.6'
    // https://mvnrepository.com/artifact/com.google.guava/guava
    implementation 'com.google.guava:guava:32.1.2-jre'
    // https://howtodoinjava.com/retrofit2/logging-with-retrofit2/
    implementation("com.squareup.okhttp3:logging-interceptor:3.9.0")
    // https://github.com/vdurmont/semver4j
    implementation 'com.vdurmont:semver4j:3.1.0'
    // Support GIF Playback
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // https://mvnrepository.com/artifact/org.eclipse.paho/org.eclipse.paho.client.mqttv3
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.mockito:mockito-core:5.10.0"
    // Pinned to the project's okhttp line; test-only fake HTTP server.
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.13'

}

// Emits a GitHub dependency-submission snapshot of this module's resolved
// dependency graph (dependency-graph/snapshots API format, purl-based).
// .github/workflows/dependency-submission.yml runs this and POSTs the JSON.
// Local preview: ./gradlew :app:dependencySubmissionSnapshot
tasks.register('dependencySubmissionSnapshot') {
    description = 'Writes build/dependency-submission-snapshot.json for GitHub dependency reporting.'
    def outFile = layout.buildDirectory.file('dependency-submission-snapshot.json')
    outputs.file(outFile)

    doLast {
        // purl -> [package_url, relationship, scope, dependencies]
        def appPackages = [:]
        def buildPackages = [:]
        def scopeRank = { String s -> s == 'runtime' ? 1 : 0 }

        // Direct deps = what the resolution root requested for this configuration.
        // (AGP leaves Configuration.dependencies / getAllDependencies() empty on the
        // variant classpaths, so the resolution result is the reliable source.)
        def declaredOf = { conf ->
            def set = new HashSet<String>()
            conf.incoming.resolutionResult.root.dependencies.each { dep ->
                def req = dep.requested
                if (req instanceof org.gradle.api.artifacts.component.ModuleComponentSelector) {
                    set.add("${req.group}:${req.module}:${req.version}")
                    if (req.module.endsWith('.gradle.plugin')) {
                        // plugins DSL: the requested module is a marker pom; count the
                        // actual plugin artifact (first hop, e.g. com.android.tools.build:gradle)
                        // as direct too.
                        def sel = (dep as org.gradle.api.artifacts.result.ResolvedDependencyResult).selected
                        if (sel != null) {
                            sel.dependencies.each { d ->
                                def ds = (d as org.gradle.api.artifacts.result.ResolvedDependencyResult).selected
                                if (ds != null && ds.moduleVersion != null) {
                                    set.add("${ds.moduleVersion.group}:${ds.moduleVersion.name}:${ds.moduleVersion.version}")
                                }
                            }
                        }
                    }
                }
            }
            set
        }

        def ingest = { conf, scope, target ->
            def declared = declaredOf(conf)
            conf.incoming.artifacts.artifacts.each { art ->
                def mci = art.id.componentIdentifier
                if (!(mci instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) {
                    return
                }
                def g = mci.group
                def a = mci.module
                def v = mci.version
                if (g == null || g == 'unspecified' || a == null || v == null || v == 'unspecified') {
                    return
                }
                def purl = "pkg:maven/${g}/${a}@${v}"
                def entry = target.get(purl)
                if (entry == null) {
                    target[purl] = [package_url: purl, relationship: 'indirect',
                                    scope: scope, dependencies: []]
                } else if (scopeRank(scope) > scopeRank(entry.scope)) {
                    entry.scope = scope
                }
                if (declared.contains("${g}:${a}:${v}")) {
                    target[purl].relationship = 'direct'
                }
            }
        }

        configurations.each { c ->
            def n = c.name
            if (n in ['debugRuntimeClasspath', 'releaseRuntimeClasspath']) {
                ingest(c, 'runtime', appPackages)
            } else if (n.endsWith('UnitTestRuntimeClasspath')) {
                ingest(c, 'development', appPackages)
            } else if (n.endsWith('AnnotationProcessorClasspath')) {
                ingest(c, 'development', appPackages)
            }
        }
        def buildscriptClasspath = rootProject.buildscript.configurations.findByName('classpath')
        if (buildscriptClasspath != null) {
            ingest(buildscriptClasspath, 'development', buildPackages)
        }

        def manifests = [:]
        if (!appPackages.isEmpty()) {
            manifests['app'] = [
                name    : 'app',
                file    : [source_location: 'app/build.gradle'],
                resolved: appPackages
            ]
        }
        if (!buildPackages.isEmpty()) {
            manifests['build'] = [
                name    : 'build',
                file    : [source_location: 'build.gradle'],
                resolved: buildPackages
            ]
        }

        def snapshot = [
            manifests: manifests,
            version  : 0,
            job      : [correlator: 'gradle-snapshot',
                        id: project.findProperty('depJobId') ?: System.getenv('GITHUB_RUN_ID') ?: 'local'],
            sha      : project.findProperty('depSha') ?: System.getenv('GITHUB_SHA') ?: '',
            ref      : project.findProperty('depRef') ?: System.getenv('GITHUB_REF') ?: '',
            scanned  : java.time.Instant.now().toString(),
            detector : [name: 'eo1-gradle-snapshot', url: 'https://github.com/aphex3k/EO1', version: '1.0']
        ]
        outFile.get().asFile.text = groovy.json.JsonOutput.toJson(snapshot)
        logger.lifecycle("dependencySubmissionSnapshot: ${appPackages.size()} app + ${buildPackages.size()} build packages -> ${outFile.get().asFile}")
    }
}