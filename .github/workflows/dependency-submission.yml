# Submits a Gradle-resolved dependency snapshot to the GitHub dependency graph
# (POST /repos/{owner}/{repo}/dependency-graph/snapshots). Prefer this workflow
# over managed "Automatic dependency submission" for this repo: user submissions
# take priority over managed runs. gradle/wrapper/gradle-wrapper.jar is committed
# as a regular git object (this repo is a GitHub fork and cannot serve its own LFS
# objects), so no LFS fetch step is needed here.
name: Dependency Submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required by the dependency-graph/snapshots API

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs cmdline-tools + platform-tools and accepts SDK licenses, so
      # AGP can auto-download platforms;34 / build-tools as needed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve dependencies and write snapshot
        run: ./gradlew --no-daemon :app:dependencySubmissionSnapshot

      - name: Submit dependency snapshot
        env:
          TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.foo-bar-preview+json" \
            -H "Content-Type: application/json" \
            --data-binary @app/build/dependency-submission-snapshot.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
